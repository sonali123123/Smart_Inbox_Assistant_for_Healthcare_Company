services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: smart-inbox-oracle
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PWD=${ORACLE_PASSWORD:-YourStrongOraclePassword123!}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db/migrations:/docker-entrypoint-initdb.d/setup:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "$ORACLE_HOME/bin/sqlplus -s / as sysdba <<< 'SELECT 1 FROM DUAL;' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  oracle-data:
    driver: local
